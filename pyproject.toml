[project]
name = "hanoi-ot"
version = "0.1.0"
description = "Data-driven Optimal Transport for Allocating Children to Vaccination Sites and Schools in Hanoi - Data Engineering Foundation (MVP)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hanoi OT Data Team" }]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "geopandas>=0.14",
    "rasterio>=1.3",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pyyaml>=6.0",
    "folium>=0.16",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
# Phase 2 (road-network distances) - intentionally NOT installed for MVP
network = ["osmnx>=1.9", "networkx>=3.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hanoi_ot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
